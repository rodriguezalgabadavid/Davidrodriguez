<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="description" content="Preparación física específica para jugadores de pádel: sesiones a medida, temporizador y seguimiento." />
  <title>PadelFit</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="28" height="28" />
      <span>PadelFit</span>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Secciones">
    <button data-route="inicio" aria-label="Inicio"><span class="ico">🏠</span><span>Inicio</span></button>
    <button data-route="entrenar" aria-label="Entrenar"><span class="ico">⚡</span><span>Entrenar</span></button>
    <button data-route="ejercicios" aria-label="Ejercicios"><span class="ico">📚</span><span>Ejercicios</span></button>
    <button data-route="progreso" aria-label="Progreso"><span class="ico">📈</span><span>Progreso</span></button>
  </nav>

  <section id="player" class="player" hidden aria-modal="true" role="dialog" aria-label="Entrenamiento en curso"></section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
